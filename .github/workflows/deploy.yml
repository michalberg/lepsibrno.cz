name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.php se sem záměrně negeneruje — o něj se stará výhradně
      # deploy-config.yml (spouštěný ručně po změně secretu). Kdyby se
      # renderoval i tady, každý běžný push by potichu přepsal config.php
      # na serveru aktuálním obsahem GitHub Secrets, i kdyby byly některé
      # z nich zastaralé (viz README.md, bod „config.php se přepisuje
      # CELÝ").

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: lepsibrno.cz/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/node_modules/**
            zadani.md
            README.md
            config.template.php
            config.local.php
            matching-status.json
            stav.json
            server-data/**
            .env
            .env.*
